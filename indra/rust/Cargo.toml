# Rust workspace for the vkstorm-rust modernisation track. Built by CMake through
# corrosion (see indra/cmake/Rust.cmake). The shared crates come from
# vkstorm-core-rust, pinned by commit.
[workspace]
resolver = "3"
members = ["vkstorm-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-only"

[workspace.dependencies]
vkstorm-j2c = { git = "https://github.com/anne-skydancer/vkstorm-core-rust", rev = "e98d7ac778e371d5d857000e7ee84ed7636823fa" }
vkstorm-llsd = { git = "https://github.com/anne-skydancer/vkstorm-core-rust", rev = "e98d7ac778e371d5d857000e7ee84ed7636823fa" }
vkstorm-volume = { git = "https://github.com/anne-skydancer/vkstorm-core-rust", rev = "e98d7ac778e371d5d857000e7ee84ed7636823fa" }
vkstorm-image = { git = "https://github.com/anne-skydancer/vkstorm-core-rust", rev = "e98d7ac778e371d5d857000e7ee84ed7636823fa" }
vkstorm-messages = { git = "https://github.com/anne-skydancer/vkstorm-core-rust", rev = "e98d7ac778e371d5d857000e7ee84ed7636823fa" }

# The viewer's Release configuration links with LTO; do the same inside the
# Rust static library. Panics abort at the C boundary anyway (caught in the
# FFI layer), so unwinding tables are not needed.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = "line-tables-only"

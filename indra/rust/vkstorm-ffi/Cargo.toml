[package]
name = "vkstorm-ffi"
description = "C ABI over the vkstorm-core-rust crates for the C++ viewer (vkstorm-rust track)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
vkstorm-j2c = { workspace = true }
vkstorm-llsd = { workspace = true }
vkstorm-volume = { workspace = true }
vkstorm-image = { workspace = true }
vkstorm-messages = { workspace = true }
vkstorm-http = { workspace = true }
vkstorm-assets = { workspace = true }
# The viewer links its prebuilt libcurl; the music player calls it by symbol.
vkstorm-audio = { workspace = true, features = ["curl-symbols"] }
vkstorm-vorbis = { workspace = true }

[features]
default = []
# OpenSim grid support (the CMake OPENSIM option): the legacy UDP paths of
# the crates that carry them.
opensim = ["vkstorm-assets/opensim"]

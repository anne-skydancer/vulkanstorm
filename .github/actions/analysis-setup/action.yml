#
# The shared setup of the analysis jobs (.github/workflows/analysis.yaml,
# doc/clean/analysis.md): the toolchain, autobuild with its packages, and one
# CMake configure of indra/ in the mode the job needs. The calling job checks
# the source out (full history) and sets AUTOBUILD_ADDRSIZE,
# AUTOBUILD_CONFIGURATION, AUTOBUILD_VSVER and LL_SKIP_REQUIRE_SYSROOT as the
# build workflows do. It builds nothing: each job builds only the library it
# analyses. The base -D options are those of .github/actions/viewer-build; the
# flags of each mode live here, so no CMake file changes.
name: Analysis setup
description: Toolchain, packages and one configure for an analysis job (doc/clean/analysis.md).
inputs:
  mode:
    description: "asan (ASan+UBSan+LSan), tsan, tidy (a compile database for clang-tidy) or msvc (/analyze)."
    required: true
  directory:
    description: "The CMake build directory."
    required: true
runs:
  using: composite
  steps:
    - name: Set source build number
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$(git rev-parse --is-shallow-repository)" != false ]]; then
          echo "Build numbering requires complete Git history" >&2
          exit 1
        fi
        build_revision=$(git rev-list --count HEAD)
        echo "revision=$build_revision" >> "$GITHUB_ENV"
        echo "AUTOBUILD_BUILD_ID=$build_revision" >> "$GITHUB_ENV"
        echo "AUTOBUILD_VARIABLES_FILE=$GITHUB_WORKSPACE/.build-variables/variables" >> "$GITHUB_ENV"
        echo "AUTOBUILD_INSTALLABLE_CACHE=$GITHUB_WORKSPACE/.autobuild-installables" >> "$GITHUB_ENV"

    - uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install Linux toolchain
      if: runner.os == 'Linux'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        sudo apt-get -o Acquire::Retries=3 update
        gcc=
        for v in 15 14; do
          if apt-get install -s "gcc-$v" "g++-$v" > /dev/null 2>&1; then gcc=$v; break; fi
        done
        test -n "$gcc"
        extra=()
        if [[ "$MODE" == tidy ]]; then extra+=(clang-tidy); fi
        sudo apt-get -o Acquire::Retries=3 install -y \
          "gcc-$gcc" "g++-$gcc" build-essential pkg-config \
          libgl1-mesa-dev libglu1-mesa-dev libpulse-dev libssl-dev \
          libxinerama-dev libxrandr-dev libfontconfig1-dev libfreetype-dev "${extra[@]}"
        echo "CC=gcc-$gcc" >> "$GITHUB_ENV"
        echo "CXX=g++-$gcc" >> "$GITHUB_ENV"
        echo "Toolchain: gcc-$gcc on $(. /etc/os-release && echo "$PRETTY_NAME")" >> "$GITHUB_STEP_SUMMARY"
        if [[ "$MODE" == tidy ]]; then clang-tidy --version | head -3 >> "$GITHUB_STEP_SUMMARY"; fi
        # A recent kernel's address-space randomisation breaks the sanitizers' fixed mappings.
        sudo sysctl -w vm.mmap_rnd_bits=28 || true

    - name: Checkout locally qualified build variables
      uses: actions/checkout@v7
      with:
        repository: FirestormViewer/fs-build-variables
        ref: c17312d38377c003977cf5b6dcc83c6042eba194
        path: .build-variables
        persist-credentials: false

    - name: Install autobuild
      shell: bash
      run: python -m pip install autobuild==3.10.2 llsd

    # Restore only: the build workflows own this cache, and the repository's cache budget is full.
    - uses: actions/cache/restore@v6
      with:
        path: .autobuild-installables
        key: ${{ runner.os }}-64-ReleaseFS_open-${{ hashFiles('autobuild.xml') }}
        restore-keys: ${{ runner.os }}-64-ReleaseFS_open-

    - name: Print free disk space
      shell: bash
      run: df -h . | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Configure
      shell: bash
      env:
        BUILD_DIRECTORY: ${{ inputs.directory }}
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        eval "$(autobuild source_environment -c ReleaseFS_open)"
        export LL_BUILD
        # The J2C codec as the viewer ships it: neo-j2k, linked statically (cmake/NeoJ2K.cmake), so the analysed build is the
        # shipped configuration and the OpenJPEG package is neither downloaded nor linked.
        options=(-DUSE_NEOJ2K:BOOL=ON -DNEOJ2K_STATIC:BOOL=ON -DUSE_MESAZINK:BOOL=OFF -DUSE_INNOSETUP:BOOL=OFF)
        tests=OFF
        case "$MODE" in
          asan | tsan)
            tests=ON
            if [[ "$MODE" == asan ]]; then
              # -fsanitize-recover=address: an ASan error does not abort (with halt_on_error=0 the test goes on, so one
              # run lists every error); UBSan recovers by default. -fno-omit-frame-pointer: readable stacks.
              # -U_FORTIFY_SOURCE: fortified libc calls and ASan's own checks of the same calls do not mix.
              flags='-fsanitize=address,undefined -fsanitize-recover=address -fno-omit-frame-pointer -U_FORTIFY_SOURCE'
            else
              flags='-fsanitize=thread -fno-omit-frame-pointer'
            fi
            options+=("-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags"
              "-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O1 -g -DNDEBUG" "-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O1 -g -DNDEBUG"
              -DGCC_DISABLE_FATAL_WARNINGS:BOOL=ON)
            ;;
          tidy)
            options+=(-DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=ON -DGCC_DISABLE_FATAL_WARNINGS:BOOL=ON)
            ;;
          msvc)
            # /analyze:WX- keeps the project's /WX from turning analysis warnings into errors;
            # /analyze:external- skips the SYSTEM includes; each object file gets a SARIF log beside it.
            LL_BUILD='/MD /O2 /Ob2 /std:c++20 /permissive- /Zc:wchar_t /Zi /GR /DLL_RELEASE=1 /DNDEBUG /D_SECURE_STL=0 /D_HAS_ITERATOR_DEBUGGING=0 /DWIN32 /D_WINDOWS /DLL_WINDOWS=1 /DUNICODE /D_UNICODE /DWINVER=0x0601 /D_WIN32_WINNT=0x0601 /DLL_OS_DRAGDROP_ENABLED=1 /DLIB_NDOF=1 /analyze /analyze:WX- /analyze:external- /analyze:log:format:sarif /analyze:autolog:ext .sarif'
            export LL_BUILD
            options+=(-G 'Visual Studio 18 2026' -A x64)
            ;;
          *) echo "unknown mode $MODE" >&2; exit 1 ;;
        esac
        # A transient GitHub server error (HTTP 5xx) while the configure downloads the packages is
        # retried after 30 s and 90 s; any other failure stops at once.
        configure() {
          cmake -S indra -B "$BUILD_DIRECTORY" "${options[@]}" \
            -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo -DADDRESS_SIZE:STRING=64 \
            -DPACKAGE:BOOL=OFF \
            -DVIEWER_CHANNEL:STRING=Vulkanstorm-Release -DROOT_PROJECT_NAME:STRING=Firestorm \
            -DPYTHON_EXECUTABLE:FILEPATH="$(python -c 'import sys; print(sys.executable)')" \
            -DOPENSIM:BOOL=OFF -DINSTALL_PROPRIETARY:BOOL=OFF \
            -DUSE_KDU:BOOL=OFF -DUSE_SOLOUD:BOOL=ON \
            -DUSE_OPENAL:BOOL=OFF -DOPENAL:BOOL=OFF -DUSE_FMODSTUDIO:BOOL=OFF -DFMODSTUDIO:BOOL=OFF \
            -DUSE_AVX2_OPTIMIZATION:BOOL=ON -DUSE_AVX_OPTIMIZATION:BOOL=OFF -DUSE_LTO:BOOL=OFF \
            -DUSE_PRECOMPILED_HEADERS:BOOL=OFF -DUSE_DISCORD:BOOL=OFF -DUSE_BUGSPLAT:BOOL=OFF \
            -DUSE_TRACY:BOOL=OFF -DUSE_VELOPACK:BOOL=OFF \
            -DLL_TESTS:BOOL="$tests" -DRELEASE_CRASH_REPORTING:BOOL=OFF \
            -DNON_RELEASE_CRASH_REPORTING:BOOL=OFF -DBUGSPLAT_DB:STRING=
        }
        for delay in 0 30 90; do
          sleep "$delay"
          if configure 2>&1 | tee "$RUNNER_TEMP/configure.log"; then
            break
          fi
          if [[ "$delay" == 90 ]] || ! grep -qE 'HTTP Error 5[0-9][0-9]|returned error: 5[0-9][0-9]|Gateway Time-?out' "$RUNNER_TEMP/configure.log"; then
            exit 1
          fi
          echo "::warning::a package download hit a server error; retrying the configure"
        done

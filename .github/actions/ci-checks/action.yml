#
# The source checks every build workflow runs before its build: the
# publication scripts' tests and the repository's own checks. The calling
# job checks the source out with full history first.
name: CI checks
description: Tests of the CI scripts and the repository checks that gate every viewer build.
inputs:
  publish:
    description: "'true' for a dispatch with publish (vkstorm-canary keeps development hooks out then)."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - run: node --test scripts/tests/ci_publish_latest.test.cjs scripts/tests/ci_promote_stable.test.cjs
      shell: bash
    - run: python3 scripts/tests/test_windows_symbol_archive.py
      shell: bash
    - run: python3 scripts/tests/test_version_schema.py
      shell: bash
    - run: python3 scripts/tests/test_contacts_layout.py
      shell: bash
    - run: python3 scripts/tests/test_projector_orbit_check.py
      shell: bash
    - run: python3 scripts/tests/test_ci_numeric_boundaries.py
      shell: bash
    - run: python3 scripts/tests/test_ndof_cmake.py
      shell: bash
    - run: python3 scripts/tests/test_slua_ui_resources.py
      shell: bash
    - run: python3 scripts/tests/test_canary_upstream_review.py
      shell: bash
    - run: python3 scripts/tests/test_slua_review.py
      shell: bash
    - run: python3 scripts/tests/test_licence_files.py
      shell: bash
    - run: python3 scripts/tests/test_msaa_bench_model.py
      shell: bash
    - run: python3 scripts/tests/test_point_faces_model.py
      shell: bash
    - run: python3 scripts/tests/test_cloud_noise_package.py
      shell: bash
    - run: python3 scripts/tests/test_projector_lamp_filter.py
      shell: bash
    - run: python3 scripts/tests/test_scene_load_bounds.py
      shell: bash
    - run: python3 scripts/tests/test_render_path_fixes.py
      shell: bash
    - run: python3 scripts/tests/test_shader_source_read.py
      shell: bash
    - run: python3 scripts/tests/test_uuid_seed_local.py
      shell: bash
    - run: python3 scripts/tests/test_face_volume_face_guard.py
      shell: bash
    - run: python3 scripts/tests/test_vertexbuffer_free_delay.py
      shell: bash
    - run: python3 scripts/tests/test_light_through_twin.py
      shell: bash
    - name: Check update version parsing
      shell: bash
      run: |
        g++ -std=c++20 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/viewer_version_parser_test.cpp -o "$RUNNER_TEMP/version-parser-test"
        "$RUNNER_TEMP/version-parser-test"
    - name: Check POSIX handshake file creation
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -I indra/newview indra/newview/tests/llscripteditorposixfile_test.cpp -o "$RUNNER_TEMP/challenge-file-test"
        "$RUNNER_TEMP/challenge-file-test"
    - name: Check the stable sun shadow cascades
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llshadowcascadefit_test.cpp -o "$RUNNER_TEMP/shadow-cascade-fit-test"
        "$RUNNER_TEMP/shadow-cascade-fit-test"
    - name: Check the projector shadow pool core (tile size, level, buddy atlas, repack, dirty boxes, scheduler)
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llprojectorshadowpool_test.cpp -o "$RUNNER_TEMP/projector-pool-test"
        "$RUNNER_TEMP/projector-pool-test"
    - name: Check the lamps' light-through layer core (the light through a face, the tap, the depth store, the carry)
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/lllightthrough_test.cpp -o "$RUNNER_TEMP/light-through-test"
        "$RUNNER_TEMP/light-through-test"
    - name: Check the point lights' shadow faces core (face pick, seams, sizes, packing, emitter skip, merged selection)
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview -I indra/llrender indra/newview/tests/llpointshadowpool_test.cpp -o "$RUNNER_TEMP/point-pool-test"
        "$RUNNER_TEMP/point-pool-test"
    - name: Check the shadow method migration
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llshadowmethod_test.cpp -o "$RUNNER_TEMP/shadow-method-test"
        "$RUNNER_TEMP/shadow-method-test"
    - name: Check the OpenGL 4.6 floor (version rule and message)
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llglfloor_test.cpp -o "$RUNNER_TEMP/gl-floor-test"
        "$RUNNER_TEMP/gl-floor-test"
        python3 scripts/tests/test_gl46_floor.py

    - name: Check the directional shadows' dark gate
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/lldirectionalshadowgate_test.cpp -o "$RUNNER_TEMP/dark-gate-test"
        "$RUNNER_TEMP/dark-gate-test"
    - name: Check that the Legacy shadow method is still Firestorm 7.2.5's code
      shell: bash
      run: |
        python3 scripts/tests/test_check_legacy_shadows.py
        python3 scripts/shadows/check_legacy_shadows.py
    - name: Check the semi-transparent shadow casters (stock stipple in Legacy, the caster rule under Stochastic)
      shell: bash
      run: python3 scripts/tests/test_shadow_alpha_permutation.py
    - name: Check the blended passes' sun-shadow gate (CPU twin, shader text)
      shell: bash
      run: python3 scripts/tests/test_alpha_sun_gate.py
    - name: Check the shadow methods' plumbing (feature tables, combo, PCSS removed)
      shell: bash
      run: python3 scripts/tests/test_shadow_method_tables.py
    - name: Check the sun and sky light terms against the GLSL
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llatmosphericlight_test.cpp -o "$RUNNER_TEMP/atmospheric-light-test"
        "$RUNNER_TEMP/atmospheric-light-test"
    - name: Check the scattering core of the physical atmosphere (bounds, tables, GLSL vectors, march accuracy)
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llatmosphericscatter_test.cpp -o "$RUNNER_TEMP/atmospheric-scatter-test"
        "$RUNNER_TEMP/atmospheric-scatter-test"
    - name: Check the clear-day base sky and the Atmosphere block (AT2-1)
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llatmospherebase_test.cpp -o "$RUNNER_TEMP/atmosphere-base-test"
        "$RUNNER_TEMP/atmosphere-base-test"
    - name: Check the EEP filter's twin against skyV.glsl and its tables (AT2-1)
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llskyfilter_test.cpp -o "$RUNNER_TEMP/sky-filter-test"
        "$RUNNER_TEMP/sky-filter-test"
    - name: Check the shipped skies against the physical atmosphere's bounds (no whiteout outside the aureole; every 8th sky)
      shell: bash
      run: python3 scripts/light/check_atmosphere_library.py --quick
    - name: Check the cloud shadow map layout and its coupling to the sky
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llcloudshadow_test.cpp -o "$RUNNER_TEMP/cloud-shadow-test"
        "$RUNNER_TEMP/cloud-shadow-test"
    - name: Check the cloud optics (beam and diffuse transmittance of the flat layer)
      shell: bash
      run: |
        for opt in -O0 -O2; do
          g++ -std=c++20 "$opt" -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llcloudoptics_test.cpp -o "$RUNNER_TEMP/cloud-optics-test"
          "$RUNNER_TEMP/cloud-optics-test"
        done
    - name: Check the cloud kind and variability layer (genera from the EEP sliders, mean-preserving variability)
      shell: bash
      run: |
        for opt in -O0 -O2; do
          g++ -std=c++20 "$opt" -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llcloudscape_test.cpp -o "$RUNNER_TEMP/cloudscape-test"
          "$RUNNER_TEMP/cloudscape-test"
        done
    - name: Check the cloud noise container reader
      shell: bash
      run: |
        test -f /usr/include/openssl/evp.h || sudo apt-get install -y --no-install-recommends libssl-dev
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llcloudnoise_test.cpp -o "$RUNNER_TEMP/cloud-noise-test" -lcrypto
        "$RUNNER_TEMP/cloud-noise-test"
    - name: Check the stochastic engine's frame rules and mask table
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llstochastichistory_test.cpp -o "$RUNNER_TEMP/stochastic-history-test"
        "$RUNNER_TEMP/stochastic-history-test"
    - name: Check the stochastic engine's golden values against the Aurora Viewer's formulas
      shell: bash
      run: python3 scripts/tests/gen_stochastic_goldens.py --check
    - name: Check the image comparison of the identical-image check
      shell: bash
      # a development test: release and the other lines do not have it
      if: hashFiles('indra/llrender/tests/llglsubmitimage_test.cpp') != ''
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/llrender indra/llrender/tests/llglsubmitimage_test.cpp -o "$RUNNER_TEMP/glsubmit-image-test"
        "$RUNNER_TEMP/glsubmit-image-test"
    - name: Check the joint number table and the decode in-flight protocol (O0 and O2, threaded)
      shell: bash
      run: |
        for opt in -O0 -O2; do
          g++ -std=c++20 $opt -Wall -Wextra -Werror -pthread -I indra/newview indra/newview/tests/lljointnumtable_test.cpp -o "$RUNNER_TEMP/jointnum-test"
          "$RUNNER_TEMP/jointnum-test"
          g++ -std=c++20 $opt -Wall -Wextra -Werror -pthread -I indra/newview indra/newview/tests/lltexturefetch_decode_inflight_test.cpp -o "$RUNNER_TEMP/decode-inflight-test"
          "$RUNNER_TEMP/decode-inflight-test"
        done
    - name: Check the stochastic layer rank (coincident blended faces in face order, sorted alpha untouched)
      shell: bash
      run: |
        python3 scripts/tests/test_stochastic_layer_rank.py
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llstochasticlayerrank_test.cpp -o "$RUNNER_TEMP/stochastic-layer-rank-test"
        "$RUNNER_TEMP/stochastic-layer-rank-test"
    - name: Check the skin palette cache's age rule (bounded while skins change, no entry in use dropped)
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llskinpalettecache_test.cpp -o "$RUNNER_TEMP/skin-palette-cache-test"
        "$RUNNER_TEMP/skin-palette-cache-test"
    - name: Check the texture streaming fixes (fetch retry rules, and the source guards of every texture streaming fix of 2026-11-18)
      shell: bash
      run: |
        python3 scripts/tests/test_texture_streaming_fixes.py
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/lltexturefetchpolicy_test.cpp -o "$RUNNER_TEMP/texture-fetch-policy-test"
        "$RUNNER_TEMP/texture-fetch-policy-test"
    - name: Check the J2C reduce factor rule (small textures decode at their coarsest level, large codestreams keep their request)
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/llimagej2coj indra/llimagej2coj/tests/llj2creduce_test.cpp -o "$RUNNER_TEMP/j2c-reduce-test"
        "$RUNNER_TEMP/j2c-reduce-test"
    - name: Check the J2C reduce factor and the decode guard against OpenJPEG (skipped with a notice when the runner has no libopenjp2)
      shell: bash
      run: |
        # Nothing is installed for it: apt would sit in the gate of every build for a check whose OpenJPEG side
        # does not change between commits. The reduce rule itself is checked without the library above.
        if pkg-config --exists libopenjp2; then
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/llimagej2coj $(pkg-config --cflags libopenjp2) indra/llimagej2coj/tests/llj2creduce_openjpeg_test.cpp -o "$RUNNER_TEMP/j2c-reduce-openjpeg-test" $(pkg-config --libs libopenjp2)
          "$RUNNER_TEMP/j2c-reduce-openjpeg-test"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/llimagej2coj $(pkg-config --cflags libopenjp2) indra/llimagej2coj/tests/llj2cdecodeguard_openjpeg_test.cpp -o "$RUNNER_TEMP/j2c-decode-guard-openjpeg-test" $(pkg-config --libs libopenjp2)
          "$RUNNER_TEMP/j2c-decode-guard-openjpeg-test"
        else
          echo "::notice title=OpenJPEG checks skipped::the runner has no libopenjp2; llj2creduce_openjpeg_test.cpp and llj2cdecodeguard_openjpeg_test.cpp did not run"
        fi
    - name: Check the SL decoder limits against the pinned OpenJPEG package
      shell: bash
      run: |
        # The limits API is in the fork's package, not in the runner's libopenjp2: fetch the pinned linux64 package
        # (the version and hash autobuild.xml pins) and build the test against its header and static library.
        # A skip is a failure here: the test must run.
        version=2.5.4.44499299587
        sha256=a1f16d88c30539c877e40bb4babcf6997a2c0f99d8e84cb2881fee36f413dc4e
        pkg="$RUNNER_TEMP/openjpeg-limits-package"
        mkdir -p "$pkg"
        curl -fsSL -o "$pkg/package.tar.zst" "https://github.com/anne-skydancer/3p-openjpeg/releases/download/v2.5.4-cpu-avx2.4/openjpeg-$version-linux64-${version##*.}.tar.zst"
        echo "$sha256  $pkg/package.tar.zst" | sha256sum -c -
        mkdir -p "$pkg/x"
        tar --zstd -xf "$pkg/package.tar.zst" -C "$pkg/x"
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/llimagej2coj -I "$pkg/x/include/openjpeg" indra/llimagej2coj/tests/llj2cdecoderlimits_openjpeg_test.cpp -o "$RUNNER_TEMP/j2c-decoder-limits-openjpeg-test" "$pkg/x/lib/release/libopenjp2.a" -lm -lpthread
        "$RUNNER_TEMP/j2c-decoder-limits-openjpeg-test" | tee "$RUNNER_TEMP/j2c-decoder-limits.log"
        grep -q "all checks passed" "$RUNNER_TEMP/j2c-decoder-limits.log"
    - name: Keep development hooks out of release
      shell: bash
      if: github.ref == 'refs/heads/vkstorm-release' || github.base_ref == 'vkstorm-release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/vkstorm-canary' && inputs.publish == 'true')
      run: python3 scripts/tests/check_release_hooks.py

#
# The source checks every build workflow runs before its build: the
# publication scripts' tests and the repository's own checks. The calling
# job checks the source out with full history first.
name: CI checks
description: Tests of the CI scripts and the repository checks that gate every viewer build.
inputs:
  publish:
    description: "'true' for a dispatch with publish (vkstorm-canary keeps development hooks out then)."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - run: node --test scripts/tests/ci_publish_latest.test.cjs scripts/tests/ci_promote_stable.test.cjs
      shell: bash
    - run: python3 scripts/tests/test_windows_symbol_archive.py
      shell: bash
    - run: python3 scripts/tests/test_version_schema.py
      shell: bash
    - run: python3 scripts/tests/test_contacts_layout.py
      shell: bash
    - run: python3 scripts/tests/test_ci_numeric_boundaries.py
      shell: bash
    - run: python3 scripts/tests/test_ndof_cmake.py
      shell: bash
    - run: python3 scripts/tests/test_slua_ui_resources.py
      shell: bash
    - run: python3 scripts/tests/test_canary_upstream_review.py
      shell: bash
    - run: python3 scripts/tests/test_slua_review.py
      shell: bash
    - run: python3 scripts/tests/test_licence_files.py
      shell: bash
    - name: Check update version parsing
      shell: bash
      run: |
        g++ -std=c++20 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/viewer_version_parser_test.cpp -o "$RUNNER_TEMP/version-parser-test"
        "$RUNNER_TEMP/version-parser-test"
    - name: Check POSIX handshake file creation
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -I indra/newview indra/newview/tests/llscripteditorposixfile_test.cpp -o "$RUNNER_TEMP/challenge-file-test"
        "$RUNNER_TEMP/challenge-file-test"
    - name: Check the stable sun shadow cascades
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llshadowcascadefit_test.cpp -o "$RUNNER_TEMP/shadow-cascade-fit-test"
        "$RUNNER_TEMP/shadow-cascade-fit-test"
    - name: Check the shadow method migration
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llshadowmethod_test.cpp -o "$RUNNER_TEMP/shadow-method-test"
        "$RUNNER_TEMP/shadow-method-test"
    - name: Check that the Legacy shadow method is still Firestorm 7.2.5's code
      shell: bash
      run: |
        python3 scripts/tests/test_check_legacy_shadows.py
        python3 scripts/shadows/check_legacy_shadows.py
    - name: Check the sun and sky light terms against the GLSL
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llatmosphericlight_test.cpp -o "$RUNNER_TEMP/atmospheric-light-test"
        "$RUNNER_TEMP/atmospheric-light-test"
    - name: Check the cloud shadow map layout and its coupling to the sky
      shell: bash
      run: |
        g++ -std=c++20 -O2 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/llcloudshadow_test.cpp -o "$RUNNER_TEMP/cloud-shadow-test"
        "$RUNNER_TEMP/cloud-shadow-test"
    - name: Keep development hooks out of release
      shell: bash
      if: github.ref == 'refs/heads/vkstorm-release' || github.base_ref == 'vkstorm-release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/vkstorm-canary' && inputs.publish == 'true')
      run: python3 scripts/tests/check_release_hooks.py

#
# The identical-code check of the style commits (scripts/ci_codegen.py, doc/clean/analysis.md "Identical compiled
# code"). The calling job checks the source out with full history at the commit the range ends at, and sets
# AUTOBUILD_ADDRSIZE, AUTOBUILD_CONFIGURATION, AUTOBUILD_VSVER and LL_SKIP_REQUIRE_SYSROOT as the analysis jobs do.
# Without a style commit in the range it does nothing after the selection.
name: Identical compiled code
description: Builds the library at each style commit and its parent and compares the object files (doc/clean/analysis.md).
inputs:
  lib:
    description: "The library (indra/<lib>) to build."
    required: true
  spec:
    description: "The commits to look at: a range A..B, or a list of commits."
    required: true
  all_style:
    description: "true: check every commit of the spec, whatever its subject (to prove the check on history)."
    default: "false"
runs:
  using: composite
  steps:
    - id: select
      shell: bash
      env:
        SPEC: ${{ inputs.spec }}
        ALL: ${{ inputs.all_style }}
      run: |
        set -euo pipefail
        # The script runs from a copy: the loop checks other commits out, and they may not have it.
        mkdir -p "$RUNNER_TEMP/codegen" codegen-out
        cp scripts/ci_codegen.py "$RUNNER_TEMP/codegen/"
        flags=()
        if [[ "$ALL" == true ]]; then flags+=(--all-style); fi
        python3 "$RUNNER_TEMP/codegen/ci_codegen.py" select --spec "$SPEC" "${flags[@]}" --out codegen-out

    - uses: ./.github/actions/analysis-setup
      if: steps.select.outputs.count != '0'
      with:
        mode: codegen
        directory: build-codegen

    - name: Build each style commit and its parent, compare the objects
      if: steps.select.outputs.count != '0'
      shell: bash
      env:
        LIB: ${{ inputs.lib }}
      run: python "$RUNNER_TEMP/codegen/ci_codegen.py" check --lib "$LIB" --dir build-codegen --selection codegen-out/selection.json --out codegen-out

    - uses: actions/upload-artifact@v7
      if: always() && steps.select.outputs.count != '0'
      with:
        name: analysis-codegen-${{ inputs.lib }}
        path: codegen-out
        retention-days: 14

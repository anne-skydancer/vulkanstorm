name: Build

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Build the Windows viewer.
        type: boolean
        default: true
      linux:
        description: Build the Linux viewer on ubuntu-26.04 (linux-latest).
        type: boolean
        default: true
      linux_lts:
        description: >-
          Build the Linux LTS viewer inside ubuntu:24.04 (GCC 14, the 24.04-built
          packages of scripts/linux_lts_packages.json, glibc 2.39 at most).
        type: boolean
        default: false
      record_inventory_fixtures:
        description: >-
          Linux (ubuntu-26.04 build) only: record the libstdc++ trees of the R2
          and R3b inventory oracles (llinventorymodel_parity, llinvfetch_parity)
          twice, require identical dumps, and upload them as the
          linux-inventory-fixtures artifact. The replay tests then fail until the
          files are committed.
        type: boolean
        default: false
      publish:
        description: >-
          Build Release packages and publish each selected platform to its own tag:
          windows-latest, linux-latest, linux-lts on vkstorm-release;
          experimental-<platform> on vkstorm-canary; preview-<platform> on
          vkstorm-devel. Other lines never publish.
        type: boolean
        default: false
  workflow_call:
  pull_request:
  push:
    branches: ["vkstorm-release", "vkstorm-devel", "vkstorm-canary", "vkstorm-vulkan", "vkstorm-vulkan-rhi", "vkstorm-vulkan-direct", "vkstorm-rust", "vkstorm-aleph", "codex/**"]
    tags: ["Second_Life*"]

permissions:
  contents: read

# Avoid compiling the same feature commit for both push and PR events.
concurrency:
  group: viewer-build-${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'codex/') && format('refs/heads/{0}', github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/') }}

jobs:
  check-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node --test scripts/tests/ci_publish_latest.test.cjs scripts/tests/ci_promote_stable.test.cjs
      - run: python3 scripts/tests/test_windows_symbol_archive.py
      - run: python3 scripts/tests/test_version_schema.py
      - run: python3 scripts/tests/test_contacts_layout.py
      - run: python3 scripts/tests/test_ci_numeric_boundaries.py
      - run: python3 scripts/tests/test_ndof_cmake.py
      - run: python3 scripts/tests/test_slua_ui_resources.py
      - run: python3 scripts/tests/test_canary_upstream_review.py
      - run: python3 scripts/tests/test_slua_review.py
      - run: python3 scripts/tests/test_licence_files.py
      - name: Check update version parsing
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/viewer_version_parser_test.cpp -o "$RUNNER_TEMP/version-parser-test"
          "$RUNNER_TEMP/version-parser-test"
      - name: Check POSIX handshake file creation
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -I indra/newview indra/newview/tests/llscripteditorposixfile_test.cpp -o "$RUNNER_TEMP/challenge-file-test"
          "$RUNNER_TEMP/challenge-file-test"
      - name: Keep development hooks out of release
        if: github.ref == 'refs/heads/vkstorm-release' || github.base_ref == 'vkstorm-release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/vkstorm-canary' && inputs.publish)
        run: python3 scripts/tests/check_release_hooks.py

  # The build matrix (.github/build-platforms.json) and what this run
  # publishes, planned by scripts/ci_publish_latest.cjs: pushes build windows
  # and linux, pull requests also linux-lts; a dispatch builds the platforms
  # its inputs select.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      builds: ${{ steps.plan.outputs.builds }}
      release: ${{ steps.plan.outputs.release }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - id: plan
        uses: actions/github-script@v9
        env:
          INPUTS: ${{ toJSON(inputs) }}
        with:
          script: |
            const { plan } = require('./scripts/ci_publish_latest.cjs');
            const result = plan({
              eventName: context.eventName, ref: context.ref, repository: `${context.repo.owner}/${context.repo.repo}`,
              inputs: JSON.parse(process.env.INPUTS || 'null'),
            });
            core.setOutput('matrix', JSON.stringify(result.matrix));
            core.setOutput('builds', String(result.matrix.include.length));
            core.setOutput('release', String(result.release));
            core.setOutput('publish', JSON.stringify(result.publish));
            core.info(JSON.stringify(result, null, 2));

  build:
    needs: [check-publication, plan]
    if: needs.plan.outputs.builds != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # Checks read "<platform> / build" and "<platform> / publish".
    name: ${{ matrix.platform }}
    uses: ./.github/workflows/viewer-platform.yaml
    # Only its publish job writes; its build job reads.
    permissions:
      contents: write
    with:
      entry: ${{ toJSON(matrix) }}
      release: ${{ needs.plan.outputs.release == 'true' }}
      tag: ${{ matrix.tag }}
      record_inventory_fixtures: ${{ github.event_name == 'workflow_dispatch' && inputs.record_inventory_fixtures == true }}

  # Publication happens in viewer-platform.yaml, per platform: each platform
  # advances its own tag once its own build succeeded.
  #   vkstorm-release: windows-latest and linux-latest on every push; linux-lts
  #     (and the others) on a dispatch with publish.
  #   vkstorm-canary: experimental-<platform>, vkstorm-devel: preview-<platform>,
  #     both only on a dispatch with publish.
  # Pull requests build windows, linux and linux-lts and never publish.
  # stable and oldstable are promoted from the vkstorm-release tags by
  # promote-stable.yaml.

  release:
    # A Second_Life tag's release takes each package whose build succeeded; a
    # failed platform does not hold back the other.
    if: ${{ !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/Second_Life') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check which platform builds succeeded
        id: built
        uses: actions/github-script@v9
        with:
          script: |
            const { buildSucceeded } = require('./scripts/ci_publish_latest.cjs');
            for (const platform of ['windows', 'linux']) {
              core.setOutput(platform, String(await buildSucceeded({ github, context, core, platform })));
            }
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-installer'
          path: installers
      - uses: secondlife-3p/action-gh-release@v1
        if: steps.built.outputs.windows == 'true'
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: installers/windows-installer/Release/*_Setup.exe
      - uses: secondlife-3p/action-gh-release@v1
        if: steps.built.outputs.linux == 'true'
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: installers/linux-installer/*-ubuntu-latest.tar.xz

name: Build

on:
  workflow_dispatch:
    inputs:
      experimental_release:
        description: >-
          vkstorm-canary only: build a Release package (Release configuration, AVX2,
          LTO, Inno Setup, no development hooks) and publish it as the experimental
          pre-release, moving the experimental tag. Never touches latest.
        type: boolean
        default: false
      record_inventory_fixtures:
        description: >-
          Linux only: record the libstdc++ trees of the R2 and R3b inventory
          oracles (llinventorymodel_parity, llinvfetch_parity) twice, require
          identical dumps, and upload them as the linux-inventory-fixtures
          artifact. The replay tests then fail until the files are committed.
        type: boolean
        default: false
  workflow_call:
  pull_request:
  push:
    branches: ["vkstorm-release", "vkstorm-devel", "vkstorm-canary", "vkstorm-vulkan", "vkstorm-vulkan-rhi", "vkstorm-vulkan-direct", "vkstorm-rust", "vkstorm-aleph", "codex/**"]
    tags: ["Second_Life*"]

permissions:
  contents: read

# Avoid compiling the same feature commit for both push and PR events.
concurrency:
  group: viewer-build-${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'codex/') && format('refs/heads/{0}', github.head_ref) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/codex/') }}

jobs:
  check-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: node --test scripts/tests/ci_publish_latest.test.cjs
      - run: python3 scripts/tests/test_windows_symbol_archive.py
      - run: python3 scripts/tests/test_version_schema.py
      - run: python3 scripts/tests/test_contacts_layout.py
      - run: python3 scripts/tests/test_ci_numeric_boundaries.py
      - run: python3 scripts/tests/test_ndof_cmake.py
      - run: python3 scripts/tests/test_slua_ui_resources.py
      - run: python3 scripts/tests/test_canary_upstream_review.py
      - run: python3 scripts/tests/test_slua_review.py
      - name: Check update version parsing
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -I indra/newview indra/newview/tests/viewer_version_parser_test.cpp -o "$RUNNER_TEMP/version-parser-test"
          "$RUNNER_TEMP/version-parser-test"
      - name: Check POSIX handshake file creation
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread -I indra/newview indra/newview/tests/llscripteditorposixfile_test.cpp -o "$RUNNER_TEMP/challenge-file-test"
          "$RUNNER_TEMP/challenge-file-test"
      - name: Keep development hooks out of release
        if: github.ref == 'refs/heads/vkstorm-release' || github.base_ref == 'vkstorm-release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/vkstorm-canary' && inputs.experimental_release)
        run: python3 scripts/tests/check_release_hooks.py

  build:
    needs: check-publication
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            directory: build-vc180-64
            container: ''
          # The Linux viewer is built inside Ubuntu 24.04 (glibc 2.39, GCC 14):
          # a binary needs at least the glibc and libstdc++ it was built
          # against, so building on the 26.04 host would raise the floor to
          # glibc 2.43. 2.39 is the lowest that works: the prebuilt Mesa/Zink
          # package already needs glibc 2.38.
          - os: ubuntu-26.04
            directory: build-linux-x86_64
            container: ubuntu:24.04
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      # Release packages: vkstorm-release pushes, Second_Life tags, and the manually
      # dispatched experimental build of vkstorm-canary.
      VIEWER_BUILD_TYPE: ${{ (github.ref == 'refs/heads/vkstorm-release' || startsWith(github.ref, 'refs/tags/Second_Life') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/vkstorm-canary' && inputs.experimental_release)) && 'Release' || 'RelWithDebInfo' }}
      VIEWER_PACKAGE: ${{ (github.ref == 'refs/heads/vkstorm-release' || startsWith(github.ref, 'refs/tags/Second_Life') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/vkstorm-canary' && inputs.experimental_release)) && 'ON' || 'OFF' }}
      AUTOBUILD_ADDRSIZE: 64
      AUTOBUILD_CONFIGURATION: ReleaseFS_open
      AUTOBUILD_VSVER: "180"
      LL_SKIP_REQUIRE_SYSROOT: 1
    steps:
      # The hosted tool cache's Python is built for the 26.04 host and its ssl
      # module does not load in the container, so Linux uses the container's
      # own Python 3 in a virtual environment.
      - name: Prepare the Linux build container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          echo "DEBIAN_FRONTEND=noninteractive" >> "$GITHUB_ENV"
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            sudo git ca-certificates curl wget file xz-utils bzip2 zstd unzip \
            make binutils lsb-release procps python3 python3-venv
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv /opt/vkstorm-python
          echo /opt/vkstorm-python/bin >> "$GITHUB_PATH"
          . /etc/os-release
          echo "Linux build container: $PRETTY_NAME, $(ldd --version | head -n 1), $(python3 --version)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set source build number
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" != false ]]; then
            echo "Build numbering requires complete Git history" >&2
            exit 1
          fi
          build_revision=$(git rev-list --count HEAD)
          [[ "$build_revision" =~ ^[1-9][0-9]*$ ]]
          # Match BuildVersion.cmake's local Git fallback on both platforms.
          # Set revision too: it has precedence over AUTOBUILD_BUILD_ID.
          echo "revision=$build_revision" >> "$GITHUB_ENV"
          echo "AUTOBUILD_BUILD_ID=$build_revision" >> "$GITHUB_ENV"
          echo "Source $(git rev-parse HEAD): build $build_revision" >> "$GITHUB_STEP_SUMMARY"
          # The github.workspace expression names the host path, not where a
          # container sees the workspace; $GITHUB_WORKSPACE is right in both.
          echo "AUTOBUILD_VARIABLES_FILE=$GITHUB_WORKSPACE/.build-variables/variables" >> "$GITHUB_ENV"
          echo "AUTOBUILD_INSTALLABLE_CACHE=$GITHUB_WORKSPACE/.autobuild-installables" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: "3.11"
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            gcc-14 g++-14 build-essential pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libpulse-dev libssl-dev \
            libxinerama-dev libxrandr-dev libfontconfig1-dev libfreetype-dev
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      - name: Checkout locally qualified build variables
        uses: actions/checkout@v7
        with:
          repository: FirestormViewer/fs-build-variables
          ref: c17312d38377c003977cf5b6dcc83c6042eba194
          path: .build-variables
          persist-credentials: false

      # autobuild 3.10.2 (the latest release) has no VS 2026 entries and warns
      # "Unable to determine a suggested AUTOBUILD_WIN_VSTOOLSET for vsver 180".
      # Upstream main is 3.10.2 plus those entries (secondlife/autobuild #61);
      # install that commit until a release carries it.
      - name: Install build dependencies
        run: python -m pip install "autobuild @ git+https://github.com/secondlife/autobuild@d8c6236eac000eb301748ec6a1df3d0894309b4b" llsd

      # The container's own CMake is 3.28; use the version of the hosted runners.
      - name: Install CMake in the Linux container
        if: runner.os == 'Linux'
        run: |
          python -m pip install cmake==4.4.4
          cmake --version

      - name: Check installer version and payload
        run: |
          python scripts/tests/test_inno_payload.py
          python scripts/tests/test_velopack_version.py

      - name: Check Linux installation scripts
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/test_linux_install_scripts.sh

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install innosetup --yes --no-progress

      - uses: actions/cache@v6
        with:
          path: .autobuild-installables
          key: ${{ runner.os }}-64-ReleaseFS_open-${{ hashFiles('autobuild.xml') }}
          restore-keys: ${{ runner.os }}-64-ReleaseFS_open-

      - name: Configure viewer
        shell: bash
        env:
          BUILD_DIRECTORY: ${{ matrix.directory }}
        run: |
          set -euo pipefail
          eval "$(autobuild source_environment -c ReleaseFS_open)"
          export LL_BUILD
          options=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            # The flags used by the successful local Release build.
            export LL_BUILD='/MD /O2 /Ob2 /std:c++20 /permissive- /Zc:wchar_t /Zi /GR /DLL_RELEASE=1 /DNDEBUG /D_SECURE_STL=0 /D_HAS_ITERATOR_DEBUGGING=0 /DWIN32 /D_WINDOWS /DLL_WINDOWS=1 /DUNICODE /D_UNICODE /DWINVER=0x0601 /D_WIN32_WINNT=0x0601 /DLL_OS_DRAGDROP_ENABLED=1 /DLIB_NDOF=1'
            options+=(-G 'Visual Studio 18 2026' -A x64 -DUSE_MESAZINK:BOOL=ON -DUSE_INNOSETUP:BOOL=ON)
          else
            options+=(-DUSE_MESAZINK:BOOL=ON -DUSE_INNOSETUP:BOOL=OFF)
          fi
          {
            echo 'LL_BUILD<<VKSTORM_LL_BUILD'
            printf '%s\n' "$LL_BUILD"
            echo 'VKSTORM_LL_BUILD'
          } >> "$GITHUB_ENV"
          cmake -S indra -B "$BUILD_DIRECTORY" "${options[@]}" \
            -DCMAKE_BUILD_TYPE:STRING="$VIEWER_BUILD_TYPE" -DADDRESS_SIZE:STRING=64 \
            -DPACKAGE:BOOL="$VIEWER_PACKAGE" \
            -DVIEWER_CHANNEL:STRING=Vulkanstorm-Release -DROOT_PROJECT_NAME:STRING=Firestorm \
            -DPYTHON_EXECUTABLE:FILEPATH="$(python -c 'import sys; print(sys.executable)')" \
            -DOPENSIM:BOOL=OFF -DINSTALL_PROPRIETARY:BOOL=OFF \
            -DUSE_KDU:BOOL=OFF -DUSE_VKS_AUDIO:BOOL=ON \
            -DUSE_OPENAL:BOOL=OFF -DOPENAL:BOOL=OFF -DUSE_FMODSTUDIO:BOOL=OFF -DFMODSTUDIO:BOOL=OFF \
            -DUSE_AVX2_OPTIMIZATION:BOOL=ON -DUSE_AVX_OPTIMIZATION:BOOL=OFF -DUSE_LTO:BOOL=ON \
            -DUSE_PRECOMPILED_HEADERS:BOOL=ON -DUSE_DISCORD:BOOL=OFF -DUSE_BUGSPLAT:BOOL=OFF \
            -DUSE_TRACY:BOOL=OFF -DUSE_VELOPACK:BOOL=OFF \
            -DLL_TESTS:BOOL=OFF -DRELEASE_CRASH_REPORTING:BOOL=OFF \
            -DNON_RELEASE_CRASH_REPORTING:BOOL=OFF -DBUGSPLAT_DB:STRING=
          if [[ "$VIEWER_BUILD_TYPE" == Release ]]; then
            python scripts/ci_release_config.py "$BUILD_DIRECTORY/CMakeCache.txt" "$RUNNER_OS"
          fi
          python scripts/ci_viewer_version.py "$BUILD_DIRECTORY/newview/viewer_version.txt"

      - name: Check Linux Mesa provider selection
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y mesa-utils mesa-vulkan-drivers xvfb xauth
          "$CXX" -std=c++20 -O2 -Wall -Wextra -Werror -I indra/llwindow \
            indra/llwindow/tests/linux_zink_loader_test.cpp -lGL -lX11 -ldl \
            -o "$RUNNER_TEMP/linux-zink-loader-test"
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$VK_DRIVER_FILES"
          export LIBGL_ALWAYS_SOFTWARE=true LIBGL_KOPPER_DRI2=true
          # No LD_LIBRARY_PATH or LD_PRELOAD entry for Mesa: exercise the viewer loader.
          xvfb-run -a glxinfo -B > "${{ matrix.directory }}/native-glxinfo.txt"
          xvfb-run -a "$RUNNER_TEMP/linux-zink-loader-test" \
            "$GITHUB_WORKSPACE/${{ matrix.directory }}/packages/lib/release/mesa" \
            | tee "${{ matrix.directory }}/zink-loader-test.txt"

      - name: Compile statistics type coverage before viewer
        run: |
          cmake -S indra -B ${{ matrix.directory }} -DVS_CI_TRACE_COMPILE_CHECK:BOOL=ON
          cmake --build ${{ matrix.directory }} --config ${{ env.VIEWER_BUILD_TYPE }} --target lltrace_compile_check --parallel 3

      # The GCC LTO link of vulkanstorm-bin writes its temporary objects to
      # $TMPDIR. On the 26.04 host /tmp is an 8 GiB tmpfs, which overran
      # ("lto-wrapper: fatal error: write: Disk quota exceeded", run
      # 40710871603), so the build uses disk-backed temporary space. A swap
      # file can only be added outside a container; the host's own 3 GiB
      # swap is what the Ubuntu 24.04 runners linked with.
      - name: Prepare Linux temporary space and swap for the LTO link
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          findmnt -T /tmp || true
          df -h / /tmp /mnt 2>/dev/null || df -h
          free -h
          base="$RUNNER_TEMP"
          if [ -d /mnt ] && [ "$(df --output=avail -k /mnt | tail -1)" -gt 41943040 ]; then base=/mnt; fi
          sudo mkdir -p "$base/vkstorm-tmp"
          sudo chown "$(id -u):$(id -g)" "$base/vkstorm-tmp"
          echo "TMPDIR=$base/vkstorm-tmp" >> "$GITHUB_ENV"
          if [ -f /.dockerenv ]; then
            echo "Building in a container: no swap file added"
          elif [ "$(df --output=avail -k "$base" | tail -1)" -gt 41943040 ]; then
            sudo fallocate -l 24G "$base/vkstorm.swap"
            sudo chmod 600 "$base/vkstorm.swap"
            sudo mkswap "$base/vkstorm.swap"
            sudo swapon "$base/vkstorm.swap"
          else
            echo "Less than 40 GiB free on $base: no swap file added"
          fi
          free -h
          echo "TMPDIR for the build: $base/vkstorm-tmp"

      - name: Build viewer and stage runtime
        run: cmake --build ${{ matrix.directory }} --config ${{ env.VIEWER_BUILD_TYPE }} --parallel 3

      # Fail if anything built or packaged needs more than Ubuntu 24.04 has:
      # glibc 2.39, and GLIBCXX_3.4.33 from GCC 14's libstdc++.
      - name: Check Linux glibc and libstdc++ requirements
        if: runner.os == 'Linux'
        shell: bash
        env:
          VKSTORM_MAX_GLIBC: "2.39"
          VKSTORM_MAX_GLIBCXX: "3.4.33"
        run: bash scripts/ci_report_glibc.sh "${{ matrix.directory }}/newview"

      - name: Keep qualification builds free of installers
        if: env.VIEWER_PACKAGE != 'ON'
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G '${{ matrix.directory }}/newview/*.tar.xz' || \
             compgen -G '${{ matrix.directory }}/newview/RelWithDebInfo/*_Setup.exe'; then
            echo 'Qualification builds must stage the viewer without producing an installer.' >&2
            exit 1
          fi

      - name: Record the libstdc++ inventory fixtures (R2, R3b)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.record_inventory_fixtures
        shell: bash
        run: |
          # GitHub runs bash with -e; the recorders exit non-zero in dump mode by
          # design, so -e must be off here. Every result is checked below.
          set +e
          set -uo pipefail
          dir="${{ matrix.directory }}"
          cmake -S indra -B "$dir" -DLL_TESTS:BOOL=ON
          # The post-build replay fails until the libstdc++ trees exist; the
          # executables are linked before it runs, and make's -i keeps it from
          # deleting them when the replay fails.
          cmake --build "$dir" --config "$VIEWER_BUILD_TYPE" --parallel 3             --target INTEGRATION_TEST_llinventorymodel_parity INTEGRATION_TEST_llinvfetch_parity -- -i || true
          r2=$(find "$dir" -name INTEGRATION_TEST_llinventorymodel_parity -type f -perm -u+x | head -1)
          r3b=$(find "$dir" -name INTEGRATION_TEST_llinvfetch_parity -type f -perm -u+x | head -1)
          test -n "$r2" && test -n "$r3b" || { echo "test executables not built"; exit 1; }
          libs="$(dirname "$r2"):$GITHUB_WORKSPACE/$dir/packages/lib/release:$GITHUB_WORKSPACE/$dir/sharedlibs/lib"
          # Under the workspace: the upload step reads it inside the container,
          # where the host temp path does not exist.
          out="$GITHUB_WORKSPACE/.inventory-fixtures"
          commit=$(git rev-parse --short=10 HEAD)
          rm -rf "$out"; mkdir -p "$out"
          for n in 1 2; do
            mkdir -p "$out/r2_$n" "$out/r3b_$n"
            for f in README.md .gitattributes; do cp indra/newview/tests/fixtures/inventory/ais/fetch/$f "$out/r3b_$n/" 2>/dev/null; done
            LD_LIBRARY_PATH="$libs" VKS_INVMODEL_COMMIT="$commit" VKS_INVMODEL_DUMP="$out/r2_$n" "$r2" > "$out/r2_$n.log" 2>&1
            LD_LIBRARY_PATH="$libs" VKS_INVFETCH_COMMIT="$commit" VKS_INVFETCH_DUMP="$out/r3b_$n"               python3 -I indra/newview/tests/vksinventory_mock_server.py -- "$r3b" > "$out/r3b_$n.log" 2>&1
            test -f "$out/r2_$n/DUMP_COMPLETE" || { echo "R2 dump $n incomplete"; tail -40 "$out/r2_$n.log"; exit 1; }
            grep -q "(0 scenarios with failures)" "$out/r3b_$n.log" || { echo "R3b dump $n failed"; tail -40 "$out/r3b_$n.log"; exit 1; }
          done
          diff -r "$out/r2_1" "$out/r2_2" || { echo "the two R2 dumps differ"; exit 1; }
          # R3b: the concurrent scenarios' "# measured" header lines vary from run
          # to run and are not compared, and manifest.txt's digests cover them.
          diff <(cd "$out/r3b_1" && find . -type f | sort) <(cd "$out/r3b_2" && find . -type f | sort) || { echo "the R3b file sets differ"; exit 1; }
          while read -r f; do
            [ "$f" = ./manifest.txt ] && continue
            diff -q <(grep -av '^#' "$out/r3b_1/$f") <(grep -av '^#' "$out/r3b_2/$f") > /dev/null || { echo "the R3b dumps differ in $f"; exit 1; }
          done < <(cd "$out/r3b_1" && find . -type f | sort)
          echo "recorded at $commit: both dumps identical"

      - name: Upload the libstdc++ inventory fixtures
        if: always() && runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.record_inventory_fixtures
        uses: actions/upload-artifact@v7
        with:
          name: linux-inventory-fixtures
          if-no-files-found: error
          # .inventory-fixtures starts with a dot: upload-artifact skips such paths by default.
          include-hidden-files: true
          path: |
            .inventory-fixtures/r2_1/
            .inventory-fixtures/r3b_1/
            .inventory-fixtures/*.log

      # Release builds (vkstorm-release pushes, Second_Life tags, the
      # experimental canary build) never build or run tests: LL_TESTS stays
      # off for Release. PR and qualification builds (RelWithDebInfo) run them.
      - name: Run statistics, script metadata, transport, primitive and night sky regression tests
        if: env.VIEWER_BUILD_TYPE != 'Release'
        shell: bash
        run: |
          set -euo pipefail
          cmake -S indra -B "${{ matrix.directory }}" -DLL_TESTS:BOOL=ON
          cmake --build "${{ matrix.directory }}" --config "$VIEWER_BUILD_TYPE" --parallel 3 \
            --target INTEGRATION_TEST_lltrace INTEGRATION_TEST_llinventory_runtime INTEGRATION_TEST_jsonrpcws INTEGRATION_TEST_wsserver \
            INTEGRATION_TEST_llimagej2coj INTEGRATION_TEST_llsdserialize_parity INTEGRATION_TEST_llvolume INTEGRATION_TEST_llimagecodecs INTEGRATION_TEST_llmessagetemplate \
            INTEGRATION_TEST_llcorehttp_parity \
            INTEGRATION_TEST_llmeshunpack_parity INTEGRATION_TEST_lltexturecache_parity INTEGRATION_TEST_lltexturefetch_parity \
            INTEGRATION_TEST_llhttpretrypolicy \
            INTEGRATION_TEST_llaudio_parity INTEGRATION_TEST_llaudio_music \
            INTEGRATION_TEST_llinventory_parity INTEGRATION_TEST_llinvfetch_parity \
            INTEGRATION_TEST_llinventorymodel_parity INTEGRATION_TEST_llaisupdate_parity \
            INTEGRATION_TEST_llinventory_task_oracle INTEGRATION_TEST_llinventory_offer_oracle \
            llprimitive_tests INTEGRATION_TEST_llnightsky llinventory_tool

      # The keep-or-port numbers of the inventory rung (doc/rust_port.md, R1):
      # the frozen C++ oracle against the viewer's Rust-backed classes in the
      # same binary, best of three, on each platform. Shared runners are noisy,
      # so the bench never fails a build; its output goes to the job summary.
      # Only non-Release builds have the tool (LL_TESTS, previous step).
      - name: Bench the inventory data model (llinventory_tool)
        if: env.VIEWER_BUILD_TYPE != 'Release'
        continue-on-error: true
        shell: bash
        run: |
          # GitHub runs bash with -e; the summary is written whatever the bench returns.
          set +e
          set -uo pipefail
          dir="${{ matrix.directory }}"
          tool=$(find "$dir/sharedlibs" -type f \( -name llinventory_tool -o -name llinventory_tool.exe \) | head -1)
          test -n "$tool" || { echo "llinventory_tool not built"; exit 1; }
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/$dir/packages/lib/release:$GITHUB_WORKSPACE/$dir/sharedlibs/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          out="$RUNNER_TEMP/llinventory_bench.txt"
          "$tool" bench 3 \
            --library indra/llinventory/tests/fixtures/library/ba2a564a-f0f1-4b82-9c61-b7520bfcd09f.inv.llsd.gz > "$out" 2>&1
          status=$?
          cat "$out"
          {
            echo "### llinventory_tool bench (${{ runner.os }}, exit $status)"
            echo '```'
            cat "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # The keep-or-port numbers of inventory sub-rung R2 (doc/rust_port.md):
      # the cache codec before the port (frozen C++) against the Rust-backed
      # live functions in one binary, and the model rows (loadSkeleton,
      # validate) over a 50k random-id world, best of three. Like the step
      # above it never fails a build and writes to the job summary.
      - name: Bench the inventory cache and login load (llinventorymodel_parity)
        if: env.VIEWER_BUILD_TYPE != 'Release'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          set -uo pipefail
          dir="${{ matrix.directory }}"
          exe=$(find "$dir/sharedlibs" -type f \( -name INTEGRATION_TEST_llinventorymodel_parity -o -name INTEGRATION_TEST_llinventorymodel_parity.exe \) | head -1)
          test -n "$exe" || { echo "INTEGRATION_TEST_llinventorymodel_parity not built"; exit 1; }
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/$dir/packages/lib/release:$GITHUB_WORKSPACE/$dir/sharedlibs/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$GITHUB_WORKSPACE/$dir/packages/lib/release:$PATH"
          out="$RUNNER_TEMP/llinventorymodel_bench.txt"
          VKS_INVMODEL_BENCH=3 VKS_INVMODEL_BENCH_SKIP_REALISTIC=1 "$exe" > "$out" 2>&1
          status=$?
          grep -E '^(bench|  [a-zA-Z])' "$out"
          {
            echo "### llinventorymodel_parity bench (${{ runner.os }}, exit $status)"
            echo '```'
            grep -E '^(bench|  [a-zA-Z])' "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Check packaged Linux Mesa runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ matrix.directory }}/newview/packaged/licenses/mesazink.txt"
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          export LIBGL_ALWAYS_SOFTWARE=true LIBGL_KOPPER_DRI2=true
          xvfb-run -a "$RUNNER_TEMP/linux-zink-loader-test" \
            "$GITHUB_WORKSPACE/${{ matrix.directory }}/newview/packaged/lib/mesa" \
            | tee "${{ matrix.directory }}/zink-packaged-test.txt"

      - name: Upload installer
        if: env.VIEWER_PACKAGE == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-installer
          if-no-files-found: error
          path: |
            ${{ matrix.directory }}/newview/Release/*_Setup.exe
            ${{ matrix.directory }}/newview/*.tar.xz

      - name: Upload qualification viewer
        if: env.VIEWER_PACKAGE != 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-qualification-viewer
          if-no-files-found: error
          path: |
            ${{ matrix.directory }}/newview/RelWithDebInfo/
            ${{ matrix.directory }}/newview/packaged/

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }}-build-evidence
          path: |
            ${{ matrix.directory }}/CMakeCache.txt
            ${{ matrix.directory }}/CMakeFiles/CMakeConfigureLog.yaml
            ${{ matrix.directory }}/packages/autobuild-package.xml
            ${{ matrix.directory }}/packages/installed-packages.xml
            ${{ matrix.directory }}/*glxinfo.txt
            ${{ matrix.directory }}/zink-*-test.txt
            ${{ matrix.directory }}/newview/viewer_version.txt

  latest:
    # PR builds validate changes but must never publish release binaries.
    if: >-
      github.repository == 'anne-skydancer/vulkanstorm' &&
      github.ref == 'refs/heads/vkstorm-release' &&
      contains(fromJSON('["push", "workflow_dispatch", "schedule"]'), github.event_name)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: vulkanstorm-latest-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-installer'
          path: installers
      - name: Publish both platforms and advance latest
        uses: actions/github-script@v9
        with:
          script: |
            const publish = require('./scripts/ci_publish_latest.cjs');
            await publish({ github, context, core, directory: 'installers' });

  experimental:
    # The manually dispatched Release build of vkstorm-canary: publishes the
    # experimental pre-release and moves the experimental tag, after both
    # platforms succeed. It never publishes to latest (canary builds must not
    # advance latest).
    if: >-
      github.repository == 'anne-skydancer/vulkanstorm' &&
      github.ref == 'refs/heads/vkstorm-canary' &&
      github.event_name == 'workflow_dispatch' && inputs.experimental_release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: vulkanstorm-experimental-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-installer'
          path: installers
      - name: Publish both platforms and move experimental
        uses: actions/github-script@v9
        with:
          script: |
            const publish = require('./scripts/ci_publish_latest.cjs');
            await publish({ github, context, core, directory: 'installers', channel: publish.channels.experimental });

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/Second_Life')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-installer'
          path: installers
      - uses: secondlife-3p/action-gh-release@v1
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installers/Windows-installer/*.exe
            installers/Linux-installer/*.tar.xz

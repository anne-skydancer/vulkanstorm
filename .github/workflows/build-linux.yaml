#
# The Linux viewer built directly on the ubuntu-26.04 runner (the newest
# GitHub runner, bumped by hand) with the linux64 packages of autobuild.xml.
# Publishes linux-latest on every vkstorm-release push; on a dispatch with
# publish, linux-latest, experimental-linux-latest (canary) or
# preview-linux-latest (devel).
# One workflow per platform, so that it publishes the moment its build
# finishes, whatever the other platforms do. It runs the shared build steps,
# .github/actions/viewer-build; the platform's data is in
# .github/build-platforms.json; doc/release_channels.md describes the tags.
name: Build Linux

on:
  pull_request:
    # A pull request that changes only CI files or documentation builds no
    # viewer: ci-lint.yaml validates it. The package list and autobuild.xml
    # are build inputs and are never ignored.
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - 'doc/**'
      - '**/*.md'
      - 'scripts/ci_*'
      - 'scripts/tests/ci_*'
      - 'scripts/tests/test_ci_files.py'
      - 'scripts/tests/test_linux_lts_packages.py'
  # Feature branches build through their pull request only, so one commit
  # never builds twice; pushes build the vkstorm-* lines. No tag triggers a
  # build.
  push:
    branches: ["vkstorm-release", "vkstorm-devel", "vkstorm-canary", "vkstorm-vulkan", "vkstorm-vulkan-rhi", "vkstorm-vulkan-direct", "vkstorm-rust", "vkstorm-aleph"]
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - 'doc/**'
      - '**/*.md'
      - 'scripts/ci_*'
      - 'scripts/tests/ci_*'
      - 'scripts/tests/test_ci_files.py'
      - 'scripts/tests/test_linux_lts_packages.py'
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Build a Release package and publish it to this line's linux tag
          (doc/release_channels.md). Only vkstorm-release, vkstorm-canary and
          vkstorm-devel publish.
        type: boolean
        default: false

permissions:
  contents: read

# One run per pull request or line: a new push cancels the previous run.
# Not on vkstorm-release (its pushes publish; a newer push queues behind
# the running one), and each dispatch has a group of its own, so a
# publication is never cancelled half-way. The publish job also holds its
# tag's lock.
concurrency:
  group: build-linux-${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/vkstorm-release') }}

jobs:
  # The repository checks, and this run's plan (scripts/ci_publish_latest.cjs
  # planPlatform): the platform's build entry, Release or not, and its tag.
  checks:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.merge.outputs.base_sha }}
      entry: ${{ steps.plan.outputs.entry }}
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the pull request into its base
        # What GitHub's merge commit would be; built here because that commit is not
        # always ready when a run starts. Local to this run, never pushed. The base
        # branch's current tip is resolved once here and handed to the build job, so
        # both merge the same commit (pull_request.base.sha is not refreshed on a reopen).
        id: merge
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          base_sha=$(git rev-parse "origin/$BASE")
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "Merging $BASE at $base_sha" >> "$GITHUB_STEP_SUMMARY"
          if ! git -c user.name=ci -c user.email=ci@invalid merge --no-edit --no-ff "$base_sha"; then
            echo "::error::this pull request conflicts with $BASE; resolve the conflict first"
            exit 1
          fi
      - uses: ./.github/actions/ci-checks
        with:
          publish: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true }}
      - id: plan
        uses: actions/github-script@v9
        env:
          INPUTS: ${{ toJSON(inputs) }}
        with:
          script: |
            const { planPlatform } = require('./scripts/ci_publish_latest.cjs');
            const result = planPlatform({
              eventName: context.eventName, ref: context.ref, repository: `${context.repo.owner}/${context.repo.repo}`,
              inputs: JSON.parse(process.env.INPUTS || 'null'), platform: 'linux',
            });
            core.setOutput('entry', JSON.stringify(result.entry));
            core.setOutput('release', String(result.release));
            core.setOutput('tag', result.tag);
            core.info(JSON.stringify(result, null, 2));

  linux:
    name: linux
    needs: checks
    runs-on: ${{ fromJSON(needs.checks.outputs.entry).os }}
    env:
      VIEWER_BUILD_TYPE: ${{ needs.checks.outputs.release == 'true' && 'Release' || 'RelWithDebInfo' }}
      VIEWER_PACKAGE: ${{ needs.checks.outputs.release == 'true' && 'ON' || 'OFF' }}
      AUTOBUILD_ADDRSIZE: 64
      AUTOBUILD_CONFIGURATION: ReleaseFS_open
      AUTOBUILD_VSVER: "180"
      LL_SKIP_REQUIRE_SYSROOT: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Merge the pull request into its base
        # The same base commit the checks job merged.
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          BASE_SHA: ${{ needs.checks.outputs.base_sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          if ! git -c user.name=ci -c user.email=ci@invalid merge --no-edit --no-ff "$BASE_SHA"; then
            echo "::error::this pull request conflicts with $BASE; resolve the conflict first"
            exit 1
          fi
      - uses: ./.github/actions/viewer-build
        with:
          platform: linux
          directory: ${{ fromJSON(needs.checks.outputs.entry).directory }}
          linux_flavor: ${{ fromJSON(needs.checks.outputs.entry).linux_flavor }}
          package_suffix: ${{ fromJSON(needs.checks.outputs.entry).package_suffix }}

  # Advances this platform's tag (a tag with its release) once its build
  # succeeded; its step names the tag.
  publish:
    name: publish
    needs: [checks, linux]
    if: needs.checks.outputs.tag != '' && needs.checks.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: vulkanstorm-publish-${{ needs.checks.outputs.tag }}
      cancel-in-progress: false
    env:
      PLATFORM: linux
      TAG: ${{ needs.checks.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-installer
          path: installers/linux-installer
      - name: Publish and move ${{ needs.checks.outputs.tag }}
        uses: actions/github-script@v9
        with:
          script: |
            const publish = require('./scripts/ci_publish_latest.cjs');
            const channel = publish.channels[process.env.TAG];
            if (!channel || !channel.platforms.includes(process.env.PLATFORM)) {
              throw new Error(`${process.env.TAG} is not a channel of ${process.env.PLATFORM}`);
            }
            await publish({ github, context, core, directory: 'installers', channel });

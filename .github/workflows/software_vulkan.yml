name: Vulkan qualification

on:
  push:
    branches: [vkstorm-vulkan, vkstorm_1.1.0, codex/vulkan-world-parity]
  pull_request:
    branches: [vkstorm-vulkan, vkstorm-devel, vkstorm_1.1.0]
  workflow_dispatch:
    inputs:
      clean_dependencies:
        description: Ignore dependency caches for reproducibility qualification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: software-vulkan-${{ github.event.pull_request.number || github.ref }}
  # Preserve long-running qualification and its diagnostic artifacts on push.
  cancel-in-progress: false

jobs:
  source-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python doc/vulkan/check_diligent_insertions.py --accept
      - run: python doc/vulkan/check_milestone1_boundaries.py
      - run: python -m unittest discover -s doc/vulkan -p 'test_*.py'
      - run: python scripts/tests/test_progress_panels.py
      - run: python scripts/tests/test_text_layout_reset.py
      - run: python scripts/tests/test_software_vulkan_runner.py
      - run: python scripts/tests/test_vulkan_evidence_package.py
      - run: python scripts/tests/test_vulkan_session_replay.py
      - run: python scripts/tests/test_chat_keyboard_routing.py
      - run: python scripts/tests/test_native_parcel_playback.py
      - run: python scripts/tests/test_native_app_url_routing.py
      - run: python scripts/tests/test_inventory_settings_controller.py
      - run: python scripts/tests/test_profile_native_location.py
      - run: python scripts/tests/test_emoji_connected_controller.py
      - run: python scripts/tests/test_native_marketplace_account.py
      - run: python scripts/tests/test_native_bridge_retirement.py
      - run: python scripts/tests/test_native_simulator_features.py
      - run: python scripts/tests/test_native_account_service_pump.py
      - run: python scripts/tests/test_world_scene_contracts.py
      - run: python scripts/tests/test_world_scene_replacement.py
      - run: python scripts/tests/test_world_motion_contracts.py
      - run: python scripts/tests/test_world_surface_picking.py
      - run: python scripts/tests/test_terrain_geometry.py
      - run: python scripts/tests/test_terrain_publication.py
      - run: python scripts/tests/test_world_gltf_ownership.py
      - run: python scripts/tests/test_world_gltf_publication.py
      - run: python scripts/tests/test_world_gltf_topology.py
      - run: python scripts/tests/test_world_wind.py
      - run: python scripts/tests/test_control_constraints.py
      - run: python scripts/tests/test_avatar_cpu_compositor.py
      - run: python scripts/tests/test_avatar_cloth.py
      - run: python scripts/tests/test_avatar_lod.py
      - run: python scripts/tests/test_volume_lod.py
      - run: python scripts/tests/test_vegetation_lod.py
      - run: python scripts/tests/test_avatar_visibility.py
      - run: python scripts/tests/test_avatar_sex_motion.py
      - run: python scripts/tests/test_specialized_motion_loading.py
      - run: python scripts/tests/test_native_appearance_admission.py
      - run: python scripts/tests/test_native_appearance_queue.py
      - run: python scripts/tests/test_avatar_lock_policy.py
      - run: python scripts/tests/test_vulkan_r2_fixture.py
      - run: python scripts/tests/test_ao_inventory_completion.py
      - run: python scripts/tests/test_native_avatar_reset.py
      - run: python scripts/tests/test_avatar_publication.py
      - run: python scripts/tests/test_avatar_bake_signature.py
      - run: python scripts/tests/test_avatar_image_pool.py
      - run: python scripts/tests/test_native_bake_callback.py
      - run: python scripts/tests/test_native_camera_transport.py
      - run: python scripts/tests/test_native_world_assets.py
      - run: python scripts/tests/test_native_http_body_limit.py
      - run: python scripts/tests/test_native_texture_cache.py
      - run: python scripts/tests/test_native_material_basis.py
      - run: python scripts/tests/test_native_texture_upload.py
      - run: python scripts/tests/test_native_image_batch.py
      - run: python scripts/tests/test_native_image_usage.py
      - run: python scripts/tests/test_native_gltf_image_lifecycle.py
      - run: python scripts/tests/test_native_local_images.py
      - run: python scripts/tests/test_native_image_eviction.py
      - run: python scripts/tests/test_native_remote_materials.py
      - run: python scripts/tests/test_vulkan_remote_material_evidence.py
      - run: python scripts/tests/test_vulkan_legacy_material_evidence.py
      - run: python scripts/tests/test_vulkan_texture_cache_instances.py
      - run: python scripts/tests/test_vulkan_local_image_evidence.py
      - run: python scripts/tests/test_vulkan_texture_cache_evidence.py
      - run: python scripts/vulkan_parity_inventory.py
      - run: python scripts/tests/test_vulkan_parity_baseline.py
      - run: python scripts/tests/test_terrain_packet.py
      - run: python scripts/tests/test_experience_account_lifetime.py
      - run: python scripts/tests/test_event_notifier_account.py
      - run: python scripts/tests/test_vulkan_viewer_diagnostic.py
      - run: python scripts/tests/test_windows_clipboard.py
      - run: python scripts/tests/test_native_pointer_leave.py
      - run: python scripts/tests/test_viewer_hover_lifecycle.py
      - run: python scripts/tests/test_vulkan_viewer_process.py
      - run: python scripts/tests/test_im_conference_lifetime.py
      - run: python scripts/tests/test_chat_history_handoff.py
      - run: python scripts/tests/test_ui_publication_retry.py
      - run: python scripts/tests/test_ci_allocation_bounds.py
      - run: python scripts/tests/test_vulkan_menu_callbacks.py
      - run: python scripts/tests/test_vulkan_preferences.py
      - run: python scripts/tests/test_vulkan_friend_status.py
      - run: python scripts/tests/test_vulkan_ui_oracle.py
      - run: python scripts/tests/test_vulkan_media_pixels.py
      - run: python scripts/tests/test_native_media_publication.py
      - run: python scripts/tests/test_native_media_interest.py
      - run: python scripts/tests/test_native_object_media.py
      - run: python scripts/tests/test_vulkan_font_registry.py
      - run: python scripts/tests/test_vulkan_ci_staging.py
      - run: python scripts/tests/test_vulkan_dependency_overlay.py
      - run: python scripts/tests/test_software_vulkan_dependencies.py

  graphics:
    needs: source-evidence
    # Cold Linux SwiftShader: 114m dependencies/viewer + 38m presentation +
    # 28m connected replay reached the former 180m limit during artifact cleanup.
      # Keep a hard bound with margin for evidence upload and the R1/R2 replays.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            driver: swiftshader
            viewer_directory: build-vc170-64
          - os: ubuntu-24.04
            driver: swiftshader
            viewer_directory: build-linux-x86_64
          - os: ubuntu-24.04
            driver: lavapipe
            viewer_directory: build-linux-x86_64
    runs-on: ${{ matrix.os }}
    env:
      AUTOBUILD_ADDRSIZE: 64
      AUTOBUILD_VSVER: '170'
      AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/.build-variables/variables
      AUTOBUILD_INSTALLABLE_CACHE: ${{ github.workspace }}/.autobuild-installables
      LL_SKIP_REQUIRE_SYSROOT: 1
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Verify Windows UI isolation
        if: runner.os == 'Windows'
        run: python scripts/tests/test_vulkan_viewer_process.py
      - name: Install tools
        run: python -m pip install -r scripts/ci_build_requirements.txt
      - name: Linux build and X11 dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y gcc-14 g++-14 build-essential pkg-config \
            libgl1-mesa-dev libglu1-mesa-dev libpulse-dev pulseaudio pulseaudio-utils libssl-dev \
            libxinerama-dev libxrandr-dev libfontconfig1-dev libfreetype6-dev \
            libsdl2-dev libx11-dev libx11-xcb-dev libxcb1-dev libxshmfence-dev xvfb xauth \
            libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-shm0-dev \
            libxcb-glx0-dev libxcb-shape0-dev libxdamage-dev libxxf86vm-dev \
            llvm-18-dev libclang-cpp18-dev libdrm-dev libelf-dev libexpat1-dev \
            libzstd-dev zlib1g-dev flex bison glslang-tools
          echo 'CC=gcc-14' >> "$GITHUB_ENV"
          echo 'CXX=g++-14' >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FirestormViewer/fs-build-variables
          ref: c17312d38377c003977cf5b6dcc83c6042eba194
          path: .build-variables
          persist-credentials: false
      - name: Identify runner image for cache compatibility
        shell: bash
        run: echo "CI_IMAGE_VERSION=${ImageVersion:?Runner image version missing}" >> "$GITHUB_ENV"
      - name: Cache immutable GHI packages and software runtime
        id: dependencies
        if: inputs.clean_dependencies != true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/ghi/*.tar.bz2
            .ci/ghi/autobuild.xml
            .ci/runtime/staged
            .ci/runtime/runtime.json
            .autobuild-installables
          key: software-vulkan-v3-${{ runner.os }}-${{ matrix.driver }}-${{ env.CI_IMAGE_VERSION }}-${{ hashFiles('scripts/ci_build_requirements.txt', '3p/vulkan-dependencies.json', '3p/3p-diligentcore/*.cmake', '3p/3p-diligentcore/*.patch', 'scripts/vulkan_ci_dependencies.json', 'scripts/build_vulkan_dependencies.py', 'scripts/build_software_vulkan.py') }}
      - name: Build and install pinned Autobuild GHI packages
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .ci/ghi/autobuild.xml ]]; then
            python scripts/build_vulkan_dependencies.py --work-dir .ci/ghi --install-only --install-dir .ci/test-packages
          else
            python scripts/build_vulkan_dependencies.py --work-dir .ci/ghi --install-dir .ci/test-packages --jobs 3
          fi
      - name: Build pinned test ICD and validation layers
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .ci/runtime/runtime.json ]]; then
            python scripts/build_software_vulkan.py --work-dir .ci/runtime --driver '${{ matrix.driver }}' --jobs 3
          fi
      - name: Build standalone staged Diligent tests
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            options+=(-G 'Visual Studio 17 2022' -A x64)
          else
            options+=(-G Ninja)
          fi
          cmake -S tests/software_vulkan -B .ci/test-build "${options[@]}" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAUTOBUILD_INSTALL_DIR="$GITHUB_WORKSPACE/.ci/test-packages"
          cmake --build .ci/test-build --config RelWithDebInfo --parallel 3
          ctest --test-dir .ci/test-build -C RelWithDebInfo --output-on-failure
      - name: Native Vulkan tests on software device
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/run_software_vulkan_tests.py --executable .ci/test-build/RelWithDebInfo/diligent_render_test.exe \
              --runtime .ci/runtime/runtime.json --evidence .ci/evidence --register-windows-manifests
          else
            xvfb-run -a -s '-screen 0 1024x768x24' python scripts/run_software_vulkan_tests.py \
              --executable .ci/test-build/diligent_render_test --runtime .ci/runtime/runtime.json --evidence .ci/evidence
          fi
      - name: Software tests without a display
        shell: bash
        run: |
          set -euo pipefail
          options=()
          executable=.ci/test-build/diligent_render_test
          if [[ "$RUNNER_OS" == Windows ]]; then
            executable=.ci/test-build/RelWithDebInfo/diligent_render_test.exe
            options+=(--register-windows-manifests)
          fi
          python scripts/run_software_vulkan_tests.py --executable "$executable" \
            --runtime .ci/runtime/runtime.json --evidence .ci/headless-evidence --headless "${options[@]}"
      - name: Retain qualified dependencies before viewer compilation
        if: inputs.clean_dependencies != true && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci/ghi/*.tar.bz2
            .ci/ghi/autobuild.xml
            .ci/runtime/staged
            .ci/runtime/runtime.json
            .autobuild-installables
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Install the same GHI into the viewer Autobuild directory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_vulkan_dependencies.py --work-dir .ci/ghi --install-only \
            --install-dir '${{ matrix.viewer_directory }}/packages'
      - name: Configure and stage development viewer without installer
        shell: bash
        run: |
          set -euo pipefail
          eval "$(autobuild source_environment -c ReleaseFS_open)"
          export LL_BUILD
          options=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            export LL_BUILD='/MD /O2 /Ob2 /std:c++20 /permissive- /Zc:wchar_t /Zi /GR /DLL_RELEASE=1 /DNDEBUG /D_SECURE_STL=0 /D_HAS_ITERATOR_DEBUGGING=0 /DWIN32 /D_WINDOWS /DLL_WINDOWS=1 /DUNICODE /D_UNICODE /DWINVER=0x0601 /D_WIN32_WINNT=0x0601 /DLL_OS_DRAGDROP_ENABLED=1 /DLIB_NDOF=1'
            options+=(-G 'Visual Studio 17 2022' -A x64)
          fi
          # CMake's existing use_prebuilt_binary() installs only enabled viewer
          # dependencies through Autobuild, excluding disabled local SDK URLs.
          cmake -S indra -B '${{ matrix.viewer_directory }}' "${options[@]}" \
            -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo -DADDRESS_SIZE:STRING=64 \
            -DVIEWER_CHANNEL:STRING=Vulkanstorm-Vulkan-Development -DROOT_PROJECT_NAME:STRING=Firestorm \
            -DPYTHON_EXECUTABLE:FILEPATH="$(python -c 'import sys; print(sys.executable)')" \
            -DUSE_DILIGENTCORE:BOOL=ON -DVS_VULKAN_DIAGNOSTICS:BOOL=ON -DUSE_MESAZINK:BOOL=OFF -DPACKAGE:BOOL=OFF \
            -DUSE_INNOSETUP:BOOL=OFF -DUSE_VELOPACK:BOOL=OFF -DUSE_TRACY:BOOL=OFF \
            -DUSE_KDU:BOOL=OFF -DUSE_FMODSTUDIO:BOOL=OFF -DFMODSTUDIO:BOOL=OFF -DUSE_SOLOUD:BOOL=ON \
            -DUSE_OPENAL:BOOL=OFF -DOPENAL:BOOL=OFF -DOPENSIM:BOOL=OFF -DINSTALL_PROPRIETARY:BOOL=OFF \
            -DUSE_AVX2_OPTIMIZATION:BOOL=ON -DUSE_AVX_OPTIMIZATION:BOOL=OFF -DUSE_LTO:BOOL=ON \
            -DUSE_PRECOMPILED_HEADERS:BOOL=ON -DUSE_DISCORD:BOOL=OFF -DUSE_BUGSPLAT:BOOL=OFF \
            -DLL_TESTS:BOOL=OFF -DRELEASE_CRASH_REPORTING:BOOL=OFF \
            -DNON_RELEASE_CRASH_REPORTING:BOOL=OFF -DBUGSPLAT_DB:STRING=
          python scripts/vulkan_parity_provenance.py begin '${{ matrix.viewer_directory }}'
          cmake --build '${{ matrix.viewer_directory }}' --config RelWithDebInfo --parallel 3
          python scripts/vulkan_parity_provenance.py finish '${{ matrix.viewer_directory }}'
          python scripts/check_vulkan_ci_staging.py '${{ matrix.viewer_directory }}'
      - name: Qualify viewer CPU geometry producers
        timeout-minutes: 3
        run: python scripts/run_vulkan_geometry_tests.py --build-directory '${{ matrix.viewer_directory }}' --evidence .ci/geometry-evidence
      - name: Provision headless audio for normal viewer startup
        if: runner.os == 'Linux'
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/audio
          audio_socket="$GITHUB_WORKSPACE/.ci/audio/native"
          export PULSE_SERVER="unix:$audio_socket"
          # WebRTC's platform ADM needs a real audio service even before login.
          # Supply playback and monitor capture without requiring audio hardware.
          pulseaudio --daemonize=yes --exit-idle-time=-1 --use-pid-file=no \
            --log-target="file:$GITHUB_WORKSPACE/.ci/audio/pulseaudio.log" -n \
            --load="module-native-protocol-unix socket=$audio_socket" \
            --load='module-null-sink sink_name=vulkan_ci rate=48000 channels=2'
          pactl set-default-sink vulkan_ci
          pactl set-default-source vulkan_ci.monitor
          pactl info > .ci/audio/server.txt
          pactl list short sinks > .ci/audio/sinks.txt
          pactl list short sources > .ci/audio/sources.txt
          grep -Fq 'vulkan_ci' .ci/audio/sinks.txt
          grep -Fq 'vulkan_ci.monitor' .ci/audio/sources.txt
          echo "PULSE_SERVER=$PULSE_SERVER" >> "$GITHUB_ENV"
      - name: Build separate pinned software OpenGL reference
        if: runner.os == 'Linux' && matrix.driver == 'lavapipe'
        timeout-minutes: 30
        shell: bash
        run: python scripts/build_software_opengl.py --work-directory .ci/opengl-reference --jobs 3
      - name: Record independent production viewer baselines
        if: runner.os == 'Linux' && matrix.driver == 'lavapipe'
        timeout-minutes: 15
        shell: bash
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' python scripts/run_vulkan_parity_baseline.py \
            --build-directory '${{ matrix.viewer_directory }}' --runtime .ci/runtime/runtime.json \
            --opengl-runtime .ci/opengl-reference/runtime.json --evidence .ci/parity-evidence
          xvfb-run -a -s '-screen 0 1024x768x24' python scripts/run_vulkan_parity_baseline.py \
            --build-directory '${{ matrix.viewer_directory }}' --runtime .ci/runtime/runtime.json \
            --opengl-runtime .ci/opengl-reference/runtime.json --evidence .ci/world-parity-evidence --scene world
          python scripts/check_vulkan_parity_r0.py \
            --startup .ci/parity-evidence/baseline-results.json \
            --world .ci/world-parity-evidence/baseline-results.json --output .ci/parity-evidence/r0-acceptance.json
      - name: Native Vulkan presentation through the staged viewer
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            options+=(--register-windows-manifests)
            python scripts/run_vulkan_viewer_diagnostic.py \
              --build-directory '${{ matrix.viewer_directory }}' --runtime .ci/runtime/runtime.json \
              --harness-evidence .ci/evidence/results.json --evidence .ci/viewer-evidence "${options[@]}"
          else
            xvfb-run -a -s '-screen 0 1024x768x24' python scripts/run_vulkan_viewer_diagnostic.py \
              --build-directory '${{ matrix.viewer_directory }}' --runtime .ci/runtime/runtime.json \
              --harness-evidence .ci/evidence/results.json --evidence .ci/viewer-evidence
          fi
      - name: Connected UI and chat through the staged viewer
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Windows ]]; then
            python scripts/run_vulkan_session_replay.py \
              --build-directory '${{ matrix.viewer_directory }}' --runtime .ci/runtime/runtime.json \
              --harness-evidence .ci/evidence/results.json --evidence .ci/session-evidence --all-skins --register-windows-manifests
          else
            xvfb-run -a -s '-screen 0 1024x768x24' python scripts/run_vulkan_session_replay.py \
              --build-directory '${{ matrix.viewer_directory }}' --runtime .ci/runtime/runtime.json \
              --harness-evidence .ci/evidence/results.json --evidence .ci/session-evidence --all-skins
          fi
      - name: Production R1 ownership and lifecycle replay
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          manifest_args=()
          # Elevated Windows runners ignore Vulkan loader environment overrides.
          # Register the pinned manifests, as in the other viewer test stages.
          if [[ "$RUNNER_OS" == Windows ]]; then
            manifest_args+=(--register-windows-manifests)
          fi
          python scripts/run_vulkan_session_replay.py \
            --build-directory '${{ matrix.viewer_directory }}' --runtime .ci/runtime/runtime.json \
            --harness-evidence .ci/evidence/results.json --evidence .ci/r1-session-evidence \
            --skin ansastorm_modern --ui-scale 1.5 --headless --r1-contracts "${manifest_args[@]}"
      - name: Production R2 geometry and appearance replay
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          manifest_args=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            manifest_args+=(--register-windows-manifests)
          fi
          python scripts/run_vulkan_session_replay.py \
            --build-directory '${{ matrix.viewer_directory }}' --runtime .ci/runtime/runtime.json \
            --harness-evidence .ci/evidence/results.json --evidence .ci/r2-session-evidence \
            --skin ansastorm_modern --ui-scale 1.5 --headless --r2-contracts "${manifest_args[@]}"
      - name: Production R3 texture streaming and persistent-cache restart matrix
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          manifest_args=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            manifest_args+=(--register-windows-manifests)
          fi
          python scripts/run_vulkan_texture_cache_tests.py \
            --build-directory '${{ matrix.viewer_directory }}' --runtime .ci/runtime/runtime.json \
            --harness-evidence .ci/evidence/results.json --evidence .ci/r3-texture-cache-evidence \
            "${manifest_args[@]}"
          python scripts/run_vulkan_texture_cache_instances.py \
            --build-directory '${{ matrix.viewer_directory }}' --runtime .ci/runtime/runtime.json \
            --harness-evidence .ci/evidence/results.json --cache-evidence .ci/r3-texture-cache-evidence \
            --evidence .ci/r3-texture-cache-instances "${manifest_args[@]}"
      - name: Record source and build environment
        if: always()
        shell: bash
        run: |
          mkdir -p .ci/evidence
          git rev-parse HEAD > .ci/evidence/source.txt
          git submodule status --recursive >> .ci/evidence/source.txt
          cmake --version > .ci/evidence/toolchain.txt
          python --version >> .ci/evidence/toolchain.txt
          python -m pip freeze >> .ci/evidence/toolchain.txt
          echo 'Runner image: ${{ runner.os }} ${{ runner.arch }}' >> .ci/evidence/toolchain.txt
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion" >> .ci/evidence/toolchain.txt
          if [[ "$RUNNER_OS" == Linux ]]; then
            gcc-14 --version >> .ci/evidence/toolchain.txt
            dpkg-query -W >> .ci/evidence/toolchain.txt
          fi
      - name: Package qualification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          completeness_args=()
          if [[ '${{ job.status }}' == success ]]; then
            completeness_args+=(--require-complete)
          fi
          python scripts/package_vulkan_evidence.py \
            --viewer-directory '${{ matrix.viewer_directory }}' "${completeness_args[@]}"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: software-vulkan-${{ runner.os }}-${{ matrix.driver }}
          if-no-files-found: error
          path: .ci/artifact-upload

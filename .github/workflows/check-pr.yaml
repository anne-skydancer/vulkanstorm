name: Check PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        uses: actions/github-script@v9
        with:
          script: |
            const description = context.payload.pull_request.body || '';
            if (description.trim().length < 20) {
              core.setFailed("❌ PR description is too short. Please provide at least 20 characters.");
            }

  no-base-merges:
    # Base lines only: a PR between feature branches has no base line to protect.
    if: startsWith(github.base_ref, 'vkstorm-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default PR merge checkout carries the checker from the base, so it
      # also runs for branches created before it existed; full history gives
      # every origin/vkstorm-* line and the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checker regression tests
        run: python3 scripts/tests/test_check_no_base_merges.py
      - name: No merges of a base line into the PR branch
        run: python3 scripts/check_no_base_merges.py "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

  chat-ui-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/tests/test_button_hover.py
      - run: python3 scripts/tests/test_chat_link_defaults.py
      - run: python3 scripts/tests/check_release_hooks.py

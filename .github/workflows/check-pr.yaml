name: Check PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-description:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description
        uses: actions/github-script@v9
        with:
          script: |
            const description = context.payload.pull_request.body || '';
            if (description.trim().length < 20) {
              core.setFailed("❌ PR description is too short. Please provide at least 20 characters.");
            }

  no-base-merges:
    # Base lines only: a PR between feature branches has no base line to protect.
    if: startsWith(github.base_ref, 'vkstorm-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default PR merge checkout carries the checker from the base, so it
      # also runs for branches created before it existed; full history gives
      # every origin/vkstorm-* line and the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # upstream/master tells upstream's commits and merges (exempt) from the
      # base lines' own history (protected).
      - name: Fetch upstream master
        run: git fetch --no-tags https://github.com/FirestormViewer/phoenix-firestorm.git +refs/heads/master:refs/remotes/upstream/master
      - name: Checker regression tests
        run: python3 scripts/tests/test_check_no_base_merges.py
      - name: No merges of a base line into the PR branch
        run: python3 scripts/check_no_base_merges.py "origin/${{ github.base_ref }}" "${{ github.event.pull_request.head.sha }}"

  chat-ui-regression:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Depth 2: the PR merge commit and its first parent (the base tip), so
      # the GLOD test can whitespace-check the PR's own changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: python3 scripts/tests/test_button_hover.py
      - run: python3 scripts/tests/test_chat_link_defaults.py
      # Development hooks may live on vkstorm-devel and on the feature branches built from it; they may not
      # reach the other lines.
      - run: python3 scripts/tests/check_release_hooks.py
        if: github.base_ref != 'vkstorm-devel' && !startsWith(github.base_ref, 'codex/')
      - run: python3 scripts/tests/test_wrapper_cpu_check.py
      - run: python3 scripts/tests/check_cpucheck_obj.py --selftest
      - run: python3 scripts/tests/check_fma_count.py --selftest
      - run: python3 scripts/tests/test_glod_retired.py
        env:
          GLOD_DIFF_BASE: HEAD^1

  slang-shaders:
    # The Slang shader pipeline (doc/slang.md): the generated GLSL is committed, so it must be what the pinned slangc
    # makes of the sources, it must compile and link as GLSL 4.60 with a real compiler, and its interfaces must agree.
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/vulkanstorm-tools
          key: slang-${{ hashFiles('scripts/shaders/slang_pin.json') }}
      - name: Install glslang
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends glslang-tools libboost-dev
      - name: Manifest parse of the loader (programs.json, boost::json header-only)
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror -I indra/llrender indra/llrender/tests/llgeneratedmanifest_test.cpp -o "$RUNNER_TEMP/generated-manifest-test"
          "$RUNNER_TEMP/generated-manifest-test" indra/newview/app_settings/shaders/generated/programs.json
      - name: Fetch the pinned Slang (checksum and version checked)
        run: python3 scripts/shaders/slang_fetch.py
      - name: Slang pipeline tests (generator, checks, gate, drift)
        env:
          SLANG_REQUIRED: '1'
        run: python3 scripts/tests/test_slang_pipeline.py
      - name: Generated shaders match their Slang sources
        run: python3 scripts/shaders/slang_gen.py --check --strict
      - name: Manifest, interface, position-module gate, and GLSL 4.60 compile and link
        run: python3 scripts/shaders/slang_check.py all
